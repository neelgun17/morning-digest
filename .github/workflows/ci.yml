name: CI

# Runs the test suites on every PR and push to main. eval.yml gates ranking
# quality (nDCG); this gates correctness — 39+ pytest and the worker's
# node:test suite were passing locally with nothing running them in CI.

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "worker/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "worker/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-MiniLM-L6-v2

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pytest
        run: python -m pytest pipeline/tests -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only gained glob-pattern support in v21.
          node-version: "22"

      - name: Run node:test
        run: node --test "worker/test/**/*.test.js"
