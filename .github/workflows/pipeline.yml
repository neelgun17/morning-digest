name: Rank candidates

# Runs the python pipeline before the Claude Code scheduled trigger fires.
# Output: daily/candidates-YYYY-MM-DD.json — the agent reads this instead of
# fetching feeds itself.

on:
  schedule:
    # 08:00 UTC — run well ahead of the 7am-local digest agent so candidates are
    # ready before it fires. GitHub cron can lag 1-3h; the agent also self-heals
    # (regenerates candidates if still missing), so this is a buffer, not a hard
    # dependency. Adjust for your timezone.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (defaults to today UTC)"
        required: false

jobs:
  rank:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-MiniLM-L6-v2

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          PIPELINE_DATE: ${{ inputs.date }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$PIPELINE_DATE" ]; then
            python -m pipeline.run --date "$PIPELINE_DATE"
          else
            python -m pipeline.run
          fi

      - name: Commit candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/candidates-*.json data/events.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::No new candidates to commit."
          else
            DATE=$(date -u +%F)
            git commit -m "Rank candidates for ${DATE}"
            # Pull-then-push to avoid losing worker writes that landed during the run
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
