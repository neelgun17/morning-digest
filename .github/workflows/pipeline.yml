name: Rank candidates

# Runs the python pipeline before the Claude Code scheduled trigger fires.
# Output: daily/candidates-YYYY-MM-DD.json — the agent reads this instead of
# fetching feeds itself.

on:
  schedule:
    # 08:00 UTC — run well ahead of the 7am-local digest agent so candidates are
    # ready before it fires. GitHub cron can lag 1-3h; the agent also self-heals
    # (regenerates candidates if still missing), so this is a buffer, not a hard
    # dependency. Adjust for your timezone.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (defaults to today UTC)"
        required: false

# Four workflows (this one, train.yml, eval.yml's refresh-baseline, judge.yml)
# plus the Worker all write to main. The Worker's writes are single-file API
# calls with their own SHA-conflict retry; these four are git push races with
# each other. Same group across all of them serializes those pushes so they
# queue instead of racing — cancel-in-progress: false because canceling a
# mid-rebase job is worse than making the next one wait.
concurrency:
  group: main-branch-writes
  cancel-in-progress: false

jobs:
  rank:
    # The public template carries these workflows for downstream users but must
    # not run them itself: it has no interests.md and no API keys, and a
    # scheduled run here would recommit candidate files into a repo that is
    # meant to ship clean. Any downstream copy has a different
    # github.repository, so this is always true for a real instance.
    if: github.repository != 'neelgun17/morning-digest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-MiniLM-L6-v2

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          PIPELINE_DATE: ${{ inputs.date }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$PIPELINE_DATE" ]; then
            python -m pipeline.run --date "$PIPELINE_DATE"
          else
            python -m pipeline.run
          fi

      - name: Commit candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage each path separately: `git add a b c` aborts entirely — and
          # stages NOTHING — if any one pathspec matches no files. The legacy
          # data/events.jsonl is gone after migration, so the single-command
          # form silently committed nothing at all.
          for p in daily/candidates-*.json data/events.jsonl data/events data/health; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "::notice::No new candidates to commit."
          else
            DATE=$(date -u +%F)
            git commit -m "Rank candidates for ${DATE}"

            # Shared with the other workflows that write to main.
            .github/scripts/push-with-retry.sh "${{ github.ref_name }}"
          fi

      # Deliberately last: candidates are already written and committed above,
      # so a degraded day still produces a digest even though this step then
      # fails the run (and GitHub emails on red by default) — the whole point
      # is to stop silent degradation, not to block the digest on it.
      - name: Check pipeline health
        run: python -m pipeline.health --check
