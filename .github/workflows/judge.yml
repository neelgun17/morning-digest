name: LLM-judge weekly

# Sample the last 7 daily digests, ask an LLM (Claude Haiku, or Gemini Flash
# if only GEMINI_API_KEY is set) to score each section 1–5 against
# interests.md, commit eval/judge-YYYY-MM-DD.json. Useful as an
# absolute-quality check that doesn't depend on user reactions accumulating.
#
# Requires repo secret ANTHROPIC_API_KEY or GEMINI_API_KEY.

on:
  schedule:
    - cron: "0 14 * * 0"   # Sundays 14:00 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "How many recent digests to judge"
        required: false
        default: "7"

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.eval --llm-judge --n "${{ inputs.n || 7 }}"

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/judge-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::No new judge report."
          else
            git commit -m "Add LLM-judge report $(date -u +%F)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
