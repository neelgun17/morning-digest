name: Ranker eval

# Runs leave-one-day-out CV on accumulated impressions+reactions and fails
# the PR if nDCG@5 drops more than 10% vs eval/baseline.json on main.
#
# eval/baseline.json is updated only by the post-merge job below — never
# from a feature branch — so the bar can only move on `main`.

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "interests.example.md"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "data/events.jsonl"
      - "data/events/**"

jobs:
  pr-check:
    # Never in the template repo — it ships no event log, so there is
    # nothing to score and the check would sit permanently red.
    if: github.event_name == 'pull_request' && github.repository != 'neelgun17/morning-digest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-MiniLM-L6-v2
      - name: Install deps
        run: pip install -r pipeline/requirements.txt
      - name: Run eval (regression-gated)
        run: python -m pipeline.eval --metrics --check

  refresh-baseline:
    if: github.event_name == 'push' && github.repository != 'neelgun17/morning-digest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with pipeline.yml, train.yml, and judge.yml — see pipeline.yml
    # for why. Job-level (not workflow-level) so pr-check, which never writes
    # to main, isn't serialized against these.
    concurrency:
      group: main-branch-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-MiniLM-L6-v2
      - name: Install deps
        run: pip install -r pipeline/requirements.txt
      - name: Refresh baseline + write report
        run: python -m pipeline.eval --metrics --update-baseline
      - name: Commit baseline + metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/baseline.json eval/metrics-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::No baseline change."
          else
            git commit -m "Refresh ranker eval baseline $(date -u +%F)"

            # Shared with the other workflows that write to main.
            .github/scripts/push-with-retry.sh main
          fi
