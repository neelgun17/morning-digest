name: Email Digest

on:
  workflow_dispatch:
  push:
    paths:
      - 'daily/*.md'
      - '!daily/sample-digest.md'
    # The scheduled agent may push the digest to a claude/* session branch
    # instead of main (runner behavior since June 2026). Trigger on those too:
    # the job below folds the branch into main, then sends the email. The
    # fold-in uses GITHUB_TOKEN, whose pushes don't re-trigger workflows, so
    # there's no double send.
    branches: [main, 'claude/**']

jobs:
  email:
    runs-on: ubuntu-latest
    # Only run if Resend is configured
    if: ${{ vars.EMAIL_ENABLED != 'false' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Merge session branch into main
        if: github.ref != 'refs/heads/main'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main -f head="${GITHUB_REF_NAME}" \
            --jq '.sha' || {
              echo "::warning::Could not auto-merge ${GITHUB_REF_NAME} into main — merge it manually, but the email below still goes out."
            }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ] || [ -z "${{ secrets.EMAIL_TO }}" ]; then
            echo "Skipping: RESEND_API_KEY or EMAIL_TO not configured."
            echo "See README for setup instructions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find new digest
        if: steps.check.outputs.skip != 'true'
        id: digest
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'daily/*.md' | grep -v sample | head -1)
          # For manual triggers, fall back to the latest digest
          if [ -z "$FILE" ]; then
            FILE=$(ls -1 daily/*.md 2>/dev/null | grep -v sample | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then
            echo "No digest found"
            exit 0
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$(basename $FILE .md)" >> "$GITHUB_OUTPUT"
          echo "Found: $FILE"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true' && steps.digest.outputs.file
        with:
          node-version: 20

      - name: Install dependencies and send
        if: steps.check.outputs.skip != 'true' && steps.digest.outputs.file
        run: |
          npm install marked@15
          node .github/scripts/send-digest.js "${{ steps.digest.outputs.file }}" "${{ steps.digest.outputs.date }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
